[project]
name = "bidmaster-skills"
version = "0.1.0"
description = "投标文档处理技能集：技能引擎 + docx 排版 + 大模型坏 JSON 修复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "老马标书贤内助" }]
keywords = ["bidding", "tender", "docx", "rtf", "skill-engine", "llm", "json-repair", "招投标", "标书", "排版"]
dependencies = [
  "python-docx>=1.1",
  "lxml>=5.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.urls]
Homepage = "https://example.com/?utm_source=github&utm_medium=readme"
Source = "https://github.com/OWNER/bidmaster-skills"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "skill_engine", "skills", "skills.docx_format", "skills.pricing_check",
  "skills.check_report_export", "skills.anon_bid_clean", "skills.risk_score",
  "skills.self_score", "skills.selfcheck_list", "utils",
  "rules_engine", "pathkit", "skills.rules_screen",
]

[tool.ruff]
line-length = 120
